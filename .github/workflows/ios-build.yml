name: PocketGigaScan iOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS device and simulator app bundles
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
          pub-cache: true
          pub-cache-path: ${{ github.workspace }}/.local/pub-cache

      - name: Record Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter --version

      - name: Validate iOS build and artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_ios_build.py
          python3 scripts/tests/test_ios_native_build.py

      - name: Prepare owned iOS native dependency cache root
        id: ios-native-cache-root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/ios-core-cache/dependencies
          repo_path="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          printf '%s\n' "$repo_path" > .build/ios-core-cache/.pocketgigascan-ios-native-cache

      - name: Restore pinned iOS SDK dependencies
        id: ios-native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/ios-core-cache/dependencies
          key: pocketgigascan-ios-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ios-dependencies.lock.json') }}-SDK-READY
          restore-keys: |
            pocketgigascan-ios-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ios-dependencies.lock.json') }}-SDK-PARTIAL-

      - name: Build pinned native core and unsigned iOS app bundles
        id: build-ios
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-stitch-ios.sh \
            --cache-dir .build/ios-core-cache \
            --output-dir .build/ios-artifacts

      - name: Diagnose failed iOS app links
        if: failure() && steps.build-ios.outcome == 'failure'
        working-directory: Apps/Flutter/stitch_app
        shell: bash
        run: |
          set +e
          xcodebuild -project ios/Runner.xcodeproj -target Runner \
            -configuration Debug -sdk iphonesimulator -showBuildSettings 2>&1 \
            | grep -E ' (ENABLE_DEBUG_DYLIB|ARCHS|SDKROOT|LIBRARY_SEARCH_PATHS|OTHER_LDFLAGS) =' || true
          core=ios/Native/iphonesimulator/liblumia_gigascan_core.a
          if [[ -f "$core" ]]; then
            nm -gU "$core" | grep -E ' _lumia_gigascan_(abi_version|free|is_available|job_json)$' || true
          else
            echo "Simulator native core archive is missing: $core"
          fi

      - name: Run NativeJobApi smoke on an available iOS simulator
        working-directory: Apps/Flutter/stitch_app
        shell: bash
        run: |
          set -euo pipefail
          device_info="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")]; chosen=next((d for d in devices if d.get("state")=="Booted"), next((d for d in devices if d.get("state")=="Shutdown"), None)); print(chosen["udid"], chosen["state"]) if chosen else sys.exit("No available iPhone simulator runtime found.")')"
          read -r device_id device_state <<<"$device_info"
          trap 'xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true' EXIT
          if [[ "$device_state" != Booted ]]; then xcrun simctl boot "$device_id"; fi
          xcrun simctl bootstatus "$device_id" -b
          flutter test integration_test/ios_native_smoke_test.dart \
            --device-id "$device_id"

      - name: Save pinned iOS SDK cache after build attempt
        if: always() && steps.ios-native-cache-root.outcome == 'success' && steps.ios-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/ios-core-cache/dependencies
          key: pocketgigascan-ios-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ios-dependencies.lock.json') }}-${{ steps.build-ios.outcome == 'success' && 'SDK-READY' || format('SDK-PARTIAL-{0}-{1}', github.run_id, github.run_attempt) }}

      - name: Upload unsigned app bundles, manifests, and SHA-256 files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketGigaScan-iOS-${{ github.sha }}
          path: .build/ios-artifacts/*
          if-no-files-found: error
          retention-days: 14
