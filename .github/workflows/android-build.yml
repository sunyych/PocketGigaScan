name: PocketGigaScan Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwarf-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android ARM64 release
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and pinned NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            ndk;28.2.13676358

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command rustup.exe -ErrorAction SilentlyContinue)) { throw 'Rustup is required on the Windows hosted runner.' }
          rustup toolchain install 1.88.0 --profile minimal --target aarch64-linux-android
          if ($LASTEXITCODE -ne 0) { throw 'Could not install Rust 1.88.0 for Android ARM64.' }
          rustup default 1.88.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not select Rust 1.88.0.' }
          rustc --version
          cargo --version

      - name: Restore pinned native source and build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .local/android-core
          key: dwarf-android-native-windows-2025-vs2026-ndk-28.2.13676358-rust-1.88.0-jxl-03e9be69-opencv-edfda20f-${{ hashFiles('scripts/build-stitch-android-core.ps1') }}

      - name: Validate Android native builder contracts
        shell: pwsh
        run: ./scripts/test-build-stitch-android-core.Tests.ps1

      - name: Build native core and JPEG XL from source with verified OpenCV SDK
        shell: pwsh
        run: ./scripts/build-stitch-android-core.ps1 -Abis @('arm64-v8a')

      - name: Resolve Flutter dependencies
        working-directory: Apps/Flutter/stitch_app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          flutter pub get --enforce-lockfile

      - name: Analyze and test Flutter app
        working-directory: Apps/Flutter/stitch_app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          flutter analyze
          flutter test

      - name: Build release APK for ARM64
        working-directory: Apps/Flutter/stitch_app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          flutter build apk --release --target-platform android-arm64

      - name: Verify APK ABI and write checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = Join-Path $PWD 'Apps/Flutter/stitch_app/build/app/outputs/flutter-apk/app-release.apk'
          if (-not (Test-Path -LiteralPath $apk)) { throw "Release APK is missing: $apk" }
          $entries = @(& tar.exe -tf $apk)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the APK archive.' }
          foreach ($required in @(
            'lib/arm64-v8a/liblumia_gigascan_core.so',
            'lib/arm64-v8a/libc++_shared.so'
          )) {
            if ($entries -notcontains $required) { throw "APK is missing required ARM64 native library: $required" }
          }
          $otherAbis = @($entries | Where-Object { $_ -match '^lib/(?!arm64-v8a/)[^/]+/[^/]+\.so$' })
          if ($otherAbis.Count -gt 0) { throw "APK unexpectedly contains native libraries for other ABIs: $($otherAbis -join ', ')" }
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$apk.sha256" -Value "$hash  app-release.apk" -NoNewline

      - name: Upload ARM64 APK and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketGigaScan-Android-arm64-${{ github.sha }}
          path: |
            Apps/Flutter/stitch_app/build/app/outputs/flutter-apk/app-release.apk
            Apps/Flutter/stitch_app/build/app/outputs/flutter-apk/app-release.apk.sha256
            .local/flutter-stitch-core/jniLibs/arm64-v8a/build-manifest.json
          if-no-files-found: error
          retention-days: 30
