name: PocketGigaScan macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dwarf-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-scene-model:
    name: Export the pinned CPU scene model
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore canonical Windows model export
        id: scene-model-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/PocketGigaScan-scene-model
          key: pocketgigascan-scene-model-windows-${{ runner.arch }}-${{ hashFiles('scripts/export-scene-model.py', 'scripts/scene-model-export.lock.json', 'scripts/scene-model-export.requirements.txt') }}
      - name: Set up Python 3.12
        if: steps.scene-model-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Export and verify the public pinned model
        if: steps.scene-model-cache.outputs.cache-hit != 'true'
        id: export-model
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $modelDir = Join-Path $env:RUNNER_TEMP 'PocketGigaScan-scene-model'
          $cacheDir = Join-Path $env:RUNNER_TEMP 'PocketGigaScan-model-cache'
          $venv = Join-Path $env:RUNNER_TEMP 'PocketGigaScan-scene-export-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Creating the isolated scene exporter environment failed.' }
          $exportPython = Join-Path $venv 'Scripts/python.exe'
          & $exportPython -m pip install --disable-pip-version-check -r scripts/scene-model-export.requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Installing the pinned scene model exporter failed.' }
          & $exportPython scripts/export-scene-model.py --output-dir $modelDir --cache-dir $cacheDir
          if ($LASTEXITCODE -ne 0) { throw 'The pinned scene model export or digest check failed.' }
      - name: Verify the cached or freshly exported model
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $modelDir = Join-Path $env:RUNNER_TEMP 'PocketGigaScan-scene-model'
          $modelPath = Join-Path $modelDir 'scene-model-v1.onnx'
          $manifestPath = Join-Path $modelDir 'scene-model-v1.manifest.json'
          if (-not (Test-Path -LiteralPath (Join-Path $modelDir 'scene-model-LICENSE.txt') -PathType Leaf)) { throw 'The scene model license is missing.' }
          python scripts/verify-macos-package.py --model $modelPath --manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { throw 'The canonical scene model SHA/manifest verification failed.' }
      - name: Upload the validated model and license
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketGigaScan-scene-model-${{ github.sha }}
          path: ${{ runner.temp }}/PocketGigaScan-scene-model/
          if-no-files-found: error
          retention-days: 7
      - name: Upload unvalidated export diagnostics after a hash mismatch
        if: failure() && steps.export-model.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNVALIDATED-PocketGigaScan-scene-model-debug-${{ github.sha }}
          path: ${{ runner.temp }}/PocketGigaScan-scene-model/
          if-no-files-found: ignore
          retention-days: 1

  macos-arm64:
    name: macOS 14+ Apple Silicon package
    needs: prepare-scene-model
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned Mac dependency builds
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/macos
          key: pocketgigascan-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos-dependencies.lock.json', 'Apps/Flutter/stitch_app/tool/native/apple/build_macos_native.sh') }}
      - name: Confirm native runner architecture and toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          cmake --version
          python3 --version
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add aarch64-apple-darwin --toolchain 1.88.0
      - name: Download validated scene model
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PocketGigaScan-scene-model-${{ github.sha }}
          path: ${{ runner.temp }}/PocketGigaScan-scene-model
      - name: Run macOS packaging contracts
        run: python3 -m unittest scripts.tests.test_macos_build -v
      - name: Build, infer, and export the portable client
        run: |
          bash scripts/build-stitch-macos.sh \
            --scene-model "$RUNNER_TEMP/PocketGigaScan-scene-model/scene-model-v1.onnx" \
            --output-dir "$RUNNER_TEMP/PocketGigaScan-macos"
      - name: Upload ad-hoc test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketGigaScan-macos-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/PocketGigaScan-macos/PocketGigaScan-macos-arm64.zip
            ${{ runner.temp }}/PocketGigaScan-macos/PocketGigaScan-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
