name: PocketGigaScan macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dwarf-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-scene-model:
    name: Download the validated canonical scene model
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for the package verifier
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download and verify the fixed public model asset
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $modelDir = Join-Path $env:RUNNER_TEMP 'PocketGigaScan-scene-model'
          $lock = Get-Content scripts/scene-model-export.lock.json -Raw | ConvertFrom-Json
          $asset = $lock.releaseAsset
          $zipPath = Join-Path $env:RUNNER_TEMP $asset.fileName
          Invoke-WebRequest -Uri $asset.url -OutFile $zipPath
          $zipInfo = Get-Item -LiteralPath $zipPath
          if ($zipInfo.Length -ne $asset.sizeBytes) { throw "Model release ZIP size mismatch: $($zipInfo.Length)" }
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          if ($zipHash -ne $asset.sha256) { throw "Model release ZIP SHA-256 mismatch: $zipHash" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($archive.Entries | ForEach-Object FullName | Sort-Object)
            $expected = @('scene-model-NOTICE.txt', 'scene-model-README.md', 'scene-model-v1.manifest.json', 'scene-model-v1.onnx') | Sort-Object
            if (Compare-Object $names $expected) { throw "Model ZIP entry layout mismatch: $($names -join ', ')" }
          } finally { $archive.Dispose() }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $modelDir
          $modelPath = Join-Path $modelDir 'scene-model-v1.onnx'
          $manifestPath = Join-Path $modelDir 'scene-model-v1.manifest.json'
          python scripts/verify-macos-package.py --model $modelPath --manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { throw 'The canonical scene model SHA/manifest verification failed.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.sourceReadmeFile -ne 'scene-model-README.md' -or $manifest.licenseNoticeFile -ne 'scene-model-NOTICE.txt') { throw 'Pinned model README or license notice is not recorded in the model manifest.' }
          if (-not (Test-Path -LiteralPath (Join-Path $modelDir 'scene-model-README.md') -PathType Leaf)) { throw 'The pinned upstream model README is missing.' }
          if (-not (Test-Path -LiteralPath (Join-Path $modelDir 'scene-model-NOTICE.txt') -PathType Leaf)) { throw 'The pinned model license notice is missing.' }
      - name: Upload the validated model and license
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketGigaScan-scene-model-${{ github.sha }}
          path: ${{ runner.temp }}/PocketGigaScan-scene-model/
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: macOS 14+ Apple Silicon package
    needs: prepare-scene-model
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore pinned Mac dependency builds
        id: macos-native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/macos
          key: pocketgigascan-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos-dependencies.lock.json') }}-READY
          restore-keys: |
            pocketgigascan-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos-dependencies.lock.json') }}-PARTIAL-
      - name: Confirm native runner architecture and toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          cmake --version
          python3 --version
          rustup toolchain install 1.88.0 --profile minimal
          rustup component add rustfmt --toolchain 1.88.0
          rustup target add aarch64-apple-darwin --toolchain 1.88.0
      - name: Download validated scene model
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PocketGigaScan-scene-model-${{ github.sha }}
          path: ${{ runner.temp }}/PocketGigaScan-scene-model
      - name: Run macOS packaging contracts
        run: python3 -m unittest scripts.tests.test_macos_build -v
      - name: Build, infer, and export the portable client
        id: build-client
        run: |
          bash scripts/build-stitch-macos.sh \
            --scene-model "$RUNNER_TEMP/PocketGigaScan-scene-model/scene-model-v1.onnx" \
            --output-dir "$RUNNER_TEMP/PocketGigaScan-macos"
      - name: Save native dependency cache after build attempt
        if: always() && steps.macos-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .build/macos
          key: pocketgigascan-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/macos-dependencies.lock.json') }}-${{ steps.build-client.outcome == 'success' && 'READY' || format('PARTIAL-{0}-{1}', github.run_id, github.run_attempt) }}
      - name: Upload ad-hoc test package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PocketGigaScan-macos-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/PocketGigaScan-macos/PocketGigaScan-macos-arm64.zip
            ${{ runner.temp }}/PocketGigaScan-macos/PocketGigaScan-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
