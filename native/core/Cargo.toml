[package]
name = "lumia-gigascan-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "CPU panorama registration and banded renderer for Lumia GigaScan"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
tiff = { version = "=0.11.3", default-features = false }
png = "0.18"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
default = []
opencv = []

[build-dependencies]
cc = "1"

[[bench]]
name = "core_engine"
harness = false
